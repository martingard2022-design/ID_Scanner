workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Build Project
        script: |
          find . -maxdepth 1 ! -name 'codemagic.yaml' ! -name '.' -exec rm -rf {} +
          flutter create id_scanner
          cd id_scanner

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.example.id_scanner"
              compileSdk 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.example.id_scanner"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              
              <application
                  android:label="id_scanner"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > pubspec.yaml
          name: id_scanner
          description: "ID Scanner App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            mobile_scanner: ^5.1.1
            excel: ^4.0.3
            path_provider: ^2.1.3
            permission_handler: ^11.3.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:mobile_scanner/mobile_scanner.dart';
          import 'package:excel/excel.dart' as excel_lib;
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'ID Scanner',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple),
                  useMaterial3: true,
                ),
                home: const ScannerHomePage(),
              );
            }
          }

          class ScannerHomePage extends StatefulWidget {
            const ScannerHomePage({super.key});

            @override
            State<ScannerHomePage> createState() => _ScannerHomePageState();
          }

          class _ScannerHomePageState extends State<ScannerHomePage> {
            final List<List<String>> _scannedData = [];
            late MobileScannerController controller;

            @override
            void initState() {
              super.initState();
              controller = MobileScannerController();
              _requestPermissions();
            }

            Future<void> _requestPermissions() async {
              await Permission.camera.request();
            }

            @override
            void dispose() {
              controller.dispose();
              super.dispose();
            }

            Future<void> _exportToExcel() async {
              if (_scannedData.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('No data to export!')),
                );
                return;
              }

              var status = await Permission.storage.request();
              if (!status.isGranted) {
                status = await Permission.manageExternalStorage.request();
              }

              var excel = excel_lib.Excel.createExcel();
              excel_lib.Sheet sheetObject = excel['Scanned IDs'];
              excel.setDefaultSheet('Scanned IDs');

              sheetObject.appendRow([
                excel_lib.TextCellValue('Timestamp'),
                excel_lib.TextCellValue('Extracted Data')
              ]);

              for (var row in _scannedData) {
                sheetObject.appendRow([
                  excel_lib.TextCellValue(row[0]),
                  excel_lib.TextCellValue(row[1])
                ]);
              }

              final directory = await getApplicationDocumentsDirectory();
              final filePath = "${directory.path}/scanned_ids_${DateTime.now().millisecondsSinceEpoch}.xlsx";
              final fileBytes = excel.save();

              if (fileBytes != null) {
                File(filePath)
                  ..createSync(recursive: true)
                  ..writeAsBytesSync(fileBytes);

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Excel saved to: $filePath')),
                  );
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('ID Scanner & Excel Export'),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.file_download),
                      onPressed: _exportToExcel,
                    )
                  ],
                ),
                body: Column(
                  children: [
                    SizedBox(
                      height: 300,
                      child: MobileScanner(
                        controller: controller,
                        onDetect: (capture) {
                          final List<Barcode> barcodes = capture.barcodes;
                          for (final barcode in barcodes) {
                            if (barcode.rawValue != null) {
                              List<String> row = [
                                DateTime.now().toString(),
                                barcode.rawValue!
                              ];
                              setState(() {
                                _scannedData.add(row);
                              });
                              break;
                            }
                          }
                        },
                      ),
                    ),
                    Expanded(
                      child: ListView.builder(
                        itemCount: _scannedData.length,
                        itemBuilder: (context, index) {
                          return ListTile(
                            leading: Text('${index + 1}'),
                            title: Text(_scannedData[index][1]),
                            subtitle: Text(_scannedData[index][0]),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          flutter pub get
          flutter build apk --release
    artifacts:
      - id_scanner/build/app/outputs/flutter-apk/*.apk
